<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Receiving Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f1f4;
    --border: #dde0e8;
    --accent: #d4870a;
    --accent2: #e8472a;
    --text: #1a1d27;
    --text-muted: #7b7f96;
    --success: #1e9e56;
    --danger: #d63031;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(212,135,10,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(232,71,42,0.04) 0%, transparent 50%);
  }

  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 1px 8px rgba(0,0,0,0.08);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  #delivery-badge {
    font-size: 0.75rem;
    font-weight: 500;
    background: rgba(245,166,35,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    display: none;
  }

  .main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .gear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  select, input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    width: 100%;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .net-weight-display {
    background: linear-gradient(135deg, rgba(212,135,10,0.08), rgba(232,71,42,0.04));
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: 0;
  }

  .net-weight-display small {
    display: block;
    font-size: 0.6rem;
    font-weight: 400;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .btn {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover { background: #f0b840; transform: translateY(-1px); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--text-muted); }

  .btn-danger {
    background: rgba(231,76,60,0.1);
    color: var(--danger);
    border: 1px solid rgba(231,76,60,0.3);
  }

  .btn-danger:hover { background: rgba(231,76,60,0.2); }

  .btn-success {
    background: rgba(46,204,113,0.15);
    color: var(--success);
    border: 1px solid rgba(46,204,113,0.3);
  }

  .btn-success:hover { background: rgba(46,204,113,0.25); }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  .action-row .btn { flex: 1; }

  /* Log */
  #log-container { overflow-x: auto; }

  .log-entry {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto auto auto auto;
    gap: 10px;
    align-items: center;
    font-size: 0.78rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-entry .field-label {
    font-size: 0.6rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 2px;
  }

  .log-entry .field-val { font-weight: 500; }
  .log-entry .net-val { color: var(--accent); font-weight: 700; }
  .log-entry .return-val { color: var(--danger); font-weight: 700; }
  .return-entry { border-color: rgba(214,48,49,0.3); background: rgba(214,48,49,0.04); }

  .delete-btn {
    background: none;
    border: 1px solid rgba(231,76,60,0.2);
    color: rgba(231,76,60,0.5);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.9rem;
    transition: all 0.2s;
    line-height: 1;
  }

  .delete-btn:hover { border-color: var(--danger); color: var(--danger); background: rgba(231,76,60,0.1); }

  #empty-log {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 32px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  .log-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto auto auto auto;
    gap: 10px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 14px 8px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .close-modal {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .close-modal:hover { color: var(--text); }

  .modal-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
  }

  .modal-list-item .item-name { font-weight: 500; }
  .modal-list-item .item-sub { color: var(--text-muted); font-size: 0.72rem; }

  .modal-add-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .modal-add-row input, .modal-add-row select { flex: 1; }

  /* Status bar */
  .status-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 0.75rem;
    color: var(--text-muted);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .status-bar.show { opacity: 1; }
  .status-bar.ok { border-color: var(--success); color: var(--success); }
  .status-bar.err { border-color: var(--danger); color: var(--danger); }

  /* Loader */
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Section footer */
  .log-footer {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .log-entry {
      grid-template-columns: 1fr 1fr;
      font-size: 0.75rem;
    }
    .log-header { display: none; }
  }

  .supplier-products-list {
    max-height: 180px;
    overflow-y: auto;
    margin-top: 8px;
  }

  .product-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,166,35,0.1);
    border: 1px solid rgba(245,166,35,0.2);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 0.7rem;
    margin: 2px;
  }

  .product-tag button {
    background: none;
    border: none;
    color: currentColor;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
    opacity: 0.6;
  }

  .product-tag button:hover { opacity: 1; }

  .temp-date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🐔 <span>RECEIVING</span> CALC</div>
  <div id="delivery-badge">Current Delivery: #DEL-001</div>
</header>

<div class="main">

  <!-- Temp & Date -->
  <div class="card">
    <div class="card-title">Session Info</div>
    <div class="temp-date-row">
      <div class="form-group">
        <label>Temperature (°C)</label>
        <input type="number" id="temp-input" placeholder="e.g. 4" step="0.1">
      </div>
      <div class="form-group">
        <label>Date (dd/mm/yyyy)</label>
        <input type="text" id="date-input" placeholder="dd/mm/yyyy">
      </div>
    </div>
  </div>

  <!-- Entry Form -->
  <div class="card">
    <div class="card-title">
      New Entry
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Supplier <button class="gear-btn" onclick="openSupplierModal()">⚙ Manage</button></label>
        <select id="supplier-select" onchange="onSupplierChange()">
          <option value="">— Select Supplier —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Product</label>
        <select id="product-select">
          <option value="">— Select Product —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Container Type <button class="gear-btn" onclick="openContainerModal()">⚙ Manage</button></label>
        <select id="container-select" onchange="calcNet()">
          <option value="">— Select Container —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantity (containers)</label>
        <input type="number" id="qty-input" min="0" value="" placeholder="0" oninput="calcNet()">
      </div>
      <div class="form-group">
        <label>Gross Weight (kg)</label>
        <input type="number" id="gross-input" step="0.01" placeholder="0.00 (negative = return)" oninput="calcNet()">
      </div>
      <div class="form-group">
        <label>Net Weight</label>
        <div class="net-weight-display">
          <small>Net Weight (kg)</small>
          <span id="net-display">—</span>
        </div>
      </div>
    </div>
    <div class="action-row" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="addEntry()">+ Add Entry</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-title">Delivery Log</div>
    <div id="log-wrapper">
      <div id="empty-log">No entries yet. Add your first entry above.</div>
    </div>
    <div class="log-footer">
      <button class="btn btn-success" onclick="exportSummary()">📊 Export Summary</button>
      <button class="btn btn-danger" onclick="clearLog()">🗑 Clear Log</button>
    </div>
  </div>

</div>

<!-- Status Bar -->
<div class="status-bar" id="status-bar"></div>

<!-- Supplier Modal -->
<div class="modal-overlay" id="supplier-modal">
  <div class="modal">
    <div class="modal-title">
      Manage Suppliers & Products
      <button class="close-modal" onclick="closeModal('supplier-modal')">✕</button>
    </div>
    <div id="supplier-list"></div>
    <div class="modal-add-row">
      <input type="text" id="new-supplier-name" placeholder="New supplier name...">
      <button class="btn btn-primary" onclick="addSupplier()">Add</button>
    </div>
    <div id="product-section" style="margin-top:16px; display:none;">
      <div style="font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:8px;">
        Products for: <span id="product-section-label"></span>
      </div>
      <div id="product-tags"></div>
      <div class="modal-add-row">
        <input type="text" id="new-product-name" placeholder="New product name...">
        <button class="btn btn-primary" onclick="addProduct()">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- Container Modal -->
<div class="modal-overlay" id="container-modal">
  <div class="modal">
    <div class="modal-title">
      Manage Container Types
      <button class="close-modal" onclick="closeModal('container-modal')">✕</button>
    </div>
    <div id="container-list"></div>
    <div class="modal-add-row">
      <input type="text" id="new-container-name" placeholder="Container name...">
      <input type="number" id="new-container-weight" placeholder="Weight (kg)" step="0.01" min="0" style="max-width:130px;">
      <button class="btn btn-primary" onclick="addContainer()">Add</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjLaOTD7JVM5u_wiauqazB-VT2aQQ7NOtWtD1vcBL0QVD9ZJyjDoB5i8gd8ZGte2Nz/exec';

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
var entries = [];
var currentDelivery = null;
var selectedSupplierForProducts = null;
var lastDeliveryCounter = 0;

var suppliers = [];
var containers = [
  { name: 'No Container', weight: 0 },
  { name: 'Bag', weight: 0.1 },
  { name: 'Crate 1.75', weight: 1.75 },
  { name: 'Crate 1.95', weight: 1.95 }
];

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  setTodayDate();
  loadFromSheets();
});

function setTodayDate() {
  var now = new Date();
  var dd = String(now.getDate()).padStart(2,'0');
  var mm = String(now.getMonth()+1).padStart(2,'0');
  var yyyy = now.getFullYear();
  document.getElementById('date-input').value = dd + '/' + mm + '/' + yyyy;
}

// ─────────────────────────────────────────────
// GOOGLE SHEETS — LOAD
// ─────────────────────────────────────────────
function loadFromSheets() {
  showStatus('Loading data...', '');
  fetch(APPS_SCRIPT_URL + '?action=load')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.suppliers) { suppliers = data.suppliers; }
      if (data.containers && data.containers.length > 0) { containers = data.containers; }
      if (data.deliveryCounter) { lastDeliveryCounter = parseInt(data.deliveryCounter) || 0; }
      renderSupplierDropdown();
      renderContainerDropdown();
      showStatus('Data loaded ✓', 'ok');
    })
    .catch(function(e) {
      console.warn('Sheets load failed, using defaults:', e);
      renderSupplierDropdown();
      renderContainerDropdown();
      showStatus('Offline mode — defaults loaded', 'err');
    });
}

// ─────────────────────────────────────────────
// GOOGLE SHEETS — POST
// ─────────────────────────────────────────────
function postToSheets(payload) {
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function(e) {
    console.warn('Sheets POST failed:', e);
  });
}

// ─────────────────────────────────────────────
// DELIVERY NUMBER
// ─────────────────────────────────────────────
function getNextDeliveryNumber() {
  lastDeliveryCounter = lastDeliveryCounter + 1;
  var delNum = 'DEL-' + String(lastDeliveryCounter).padStart(3, '0');
  // Persist the new counter value to Sheets
  postToSheets({ action: 'updateDeliveryCounter', counter: lastDeliveryCounter });
  return delNum;
}

function updateDeliveryBadge() {
  var badge = document.getElementById('delivery-badge');
  if (entries.length === 0) {
    badge.style.display = 'none';
    return;
  }
  badge.style.display = 'inline-block';
  badge.textContent = 'Current Delivery: #' + (currentDelivery || '—');
}

// ─────────────────────────────────────────────
// CALCULATION
// ─────────────────────────────────────────────
function calcNet() {
  var cIdx = document.getElementById('container-select').selectedIndex;
  var cSel = document.getElementById('container-select');
  var cWeight = cSel.options[cIdx] ? parseFloat(cSel.options[cIdx].getAttribute('data-weight')) || 0 : 0;
  var qty = parseFloat(document.getElementById('qty-input').value) || 0;
  var gross = parseFloat(document.getElementById('gross-input').value) || 0;
  var net = gross - (cWeight * qty);
  var display = isNaN(net) ? '—' : net.toFixed(2) + ' kg';
  var el = document.getElementById('net-display');
  el.textContent = display;
  // Visual indicator for returns (negative net)
  var container = el.closest('.net-weight-display');
  if (!isNaN(net) && net < 0) {
    container.style.background = 'linear-gradient(135deg, rgba(214,48,49,0.08), rgba(214,48,49,0.03))';
    container.style.borderColor = 'var(--danger)';
    el.style.color = 'var(--danger)';
    var label = container.querySelector('small');
    if (label) { label.textContent = 'RETURN — Net Weight (kg)'; }
  } else {
    container.style.background = '';
    container.style.borderColor = '';
    el.style.color = '';
    var label = container.querySelector('small');
    if (label) { label.textContent = 'Net Weight (kg)'; }
  }
}

// ─────────────────────────────────────────────
// SUPPLIER DROPDOWN
// ─────────────────────────────────────────────
function renderSupplierDropdown() {
  var sel = document.getElementById('supplier-select');
  var val = sel.value;
  sel.innerHTML = '<option value="">— Select Supplier —</option>';
  suppliers.forEach(function(s) {
    var o = document.createElement('option');
    o.value = s.name;
    o.textContent = s.name;
    sel.appendChild(o);
  });
  if (val) { sel.value = val; onSupplierChange(); }
}

function onSupplierChange() {
  var sel = document.getElementById('supplier-select');
  var sName = sel.value;
  var pSel = document.getElementById('product-select');
  pSel.innerHTML = '<option value="">— Select Product —</option>';
  if (!sName) { return; }
  var supp = suppliers.find(function(s) { return s.name === sName; });
  if (supp && supp.products) {
    supp.products.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p;
      o.textContent = p;
      pSel.appendChild(o);
    });
  }
}

// ─────────────────────────────────────────────
// CONTAINER DROPDOWN
// ─────────────────────────────────────────────
function renderContainerDropdown() {
  var sel = document.getElementById('container-select');
  var val = sel.value;
  sel.innerHTML = '<option value="">— Select Container —</option>';
  containers.forEach(function(c) {
    var o = document.createElement('option');
    o.value = c.name;
    o.textContent = c.name + ' (' + c.weight + ' kg)';
    o.setAttribute('data-weight', c.weight);
    sel.appendChild(o);
  });
  if (val) { sel.value = val; }
  calcNet();
}

// ─────────────────────────────────────────────
// ADD ENTRY
// ─────────────────────────────────────────────
function addEntry() {
  var supplier = document.getElementById('supplier-select').value;
  var product = document.getElementById('product-select').value;
  var cSel = document.getElementById('container-select');
  var cName = cSel.value;
  var cIdx = cSel.selectedIndex;
  var cWeight = cSel.options[cIdx] ? parseFloat(cSel.options[cIdx].getAttribute('data-weight')) || 0 : 0;
  var qty = parseFloat(document.getElementById('qty-input').value);
  var gross = parseFloat(document.getElementById('gross-input').value);

  if (!supplier) { showStatus('Please select a supplier', 'err'); return; }
  if (!product) { showStatus('Please select a product', 'err'); return; }
  if (!cName) { showStatus('Please select a container type', 'err'); return; }
  if (isNaN(qty) || qty < 0) { showStatus('Enter valid quantity', 'err'); return; }
  if (isNaN(gross)) { showStatus('Enter valid gross weight', 'err'); return; }

  var net = gross - (cWeight * qty);
  var now = new Date();

  if (!currentDelivery) {
    currentDelivery = getNextDeliveryNumber();
  }

  var entry = {
    id: Date.now(),
    deliveryNum: currentDelivery,
    timestamp: now.toISOString(),
    supplier: supplier,
    product: product,
    containerType: cName,
    containerWeight: cWeight,
    quantity: qty,
    grossWeight: gross,
    containerWeightTotal: cWeight * qty,
    netWeight: net
  };

  entries.push(entry);
  renderLog();
  updateDeliveryBadge();

  // Post to sheets
  postToSheets({ action: 'addEntry', entry: entry });
  showStatus('Entry added ✓', 'ok');

  // Reset form fields (keep supplier/container)
  document.getElementById('product-select').value = '';
  document.getElementById('qty-input').value = '';
  document.getElementById('gross-input').value = '';
  document.getElementById('net-display').textContent = '—';
}

// ─────────────────────────────────────────────
// RENDER LOG
// ─────────────────────────────────────────────
function renderLog() {
  var wrap = document.getElementById('log-wrapper');
  if (entries.length === 0) {
    wrap.innerHTML = '<div id="empty-log">No entries yet. Add your first entry above.</div>';
    return;
  }

  var html = '<div class="log-header">'
    + '<span>Supplier / Product</span>'
    + '<span>Container</span>'
    + '<span>Qty</span>'
    + '<span>Gross (kg)</span>'
    + '<span>CTR Wt (kg)</span>'
    + '<span>Net (kg)</span>'
    + '<span></span>'
    + '</div>';

  entries.forEach(function(e) {
    var isReturn = e.netWeight < 0;
    var entryClass = isReturn ? 'log-entry return-entry' : 'log-entry';
    var netClass = isReturn ? 'field-val return-val' : 'field-val net-val';
    var netLabel = isReturn ? '↩ RETURN' : 'Net';
    html += '<div class="' + entryClass + '">'
      + '<div><div class="field-label">Supplier</div><div class="field-val">' + esc(e.supplier) + '<br><small style="color:var(--text-muted)">' + esc(e.product) + '</small></div></div>'
      + '<div><div class="field-label">Container</div><div class="field-val">' + esc(e.containerType) + '</div></div>'
      + '<div><div class="field-label">Qty</div><div class="field-val">' + e.quantity + '</div></div>'
      + '<div><div class="field-label">Gross</div><div class="field-val">' + e.grossWeight.toFixed(2) + '</div></div>'
      + '<div><div class="field-label">CTR Wt</div><div class="field-val">' + e.containerWeightTotal.toFixed(2) + '</div></div>'
      + '<div><div class="field-label">' + netLabel + '</div><div class="' + netClass + '">' + e.netWeight.toFixed(2) + '</div></div>'
      + '<button class="delete-btn" onclick="deleteEntry(' + e.id + ')">🗑️</button>'
      + '</div>';
  });

  wrap.innerHTML = html;
}

// ─────────────────────────────────────────────
// DELETE ENTRY
// ─────────────────────────────────────────────
function deleteEntry(id) {
  var idx = entries.findIndex(function(e) { return e.id === id; });
  if (idx === -1) { return; }
  var entry = entries[idx];
  entries.splice(idx, 1);

  postToSheets({ action: 'deleteEntry', id: id, deliveryNum: entry.deliveryNum, timestamp: entry.timestamp });
  renderLog();
  updateDeliveryBadge();
  showStatus('Entry deleted', 'ok');
}

// ─────────────────────────────────────────────
// CLEAR LOG
// ─────────────────────────────────────────────
function clearLog() {
  if (entries.length === 0) { showStatus('Log is already empty', ''); return; }
  if (!confirm('Clear all current delivery entries? (Data remains in Google Sheets)')) { return; }
  entries = [];
  currentDelivery = null;
  renderLog();
  updateDeliveryBadge();
  showStatus('Log cleared', 'ok');
}

// ─────────────────────────────────────────────
// EXPORT SUMMARY
// ─────────────────────────────────────────────
function exportSummary() {
  if (entries.length === 0) { showStatus('No entries to export', 'err'); return; }

  var temp = document.getElementById('temp-input').value || '—';
  var date = document.getElementById('date-input').value || '—';
  var delivery = currentDelivery || '—';
  var totalNet = entries.reduce(function(s, e) { return s + e.netWeight; }, 0);

  // Container counts summary
  var ctrCounts = {};
  entries.forEach(function(e) {
    ctrCounts[e.containerType] = (ctrCounts[e.containerType] || 0) + (parseInt(e.quantity) || 0);
  });

  var wb = XLSX.utils.book_new();
  var wsData = [];

  // Header block
  wsData.push(['CHICKEN RECEIVING SUMMARY']);
  wsData.push(['TEMP (°C)', temp]);
  wsData.push(['DATE', date]);
  wsData.push(['DELIVERY', delivery]);
  wsData.push(['TOTAL KGS (NET)', totalNet.toFixed(2)]);
  wsData.push([]);

  // Container counts
  wsData.push(['CONTAINER COUNTS']);
  Object.keys(ctrCounts).forEach(function(k) {
    wsData.push([k, ctrCounts[k]]);
  });
  wsData.push([]);

  // Column headers
  wsData.push(['Product', 'Container Type', 'Qty CTR', 'GRS Weight', 'CTR Weight (kg)', 'NET Weight (kg)']);

  // Group by supplier
  var supplierGroups = {};
  entries.forEach(function(e) {
    if (!supplierGroups[e.supplier]) { supplierGroups[e.supplier] = []; }
    supplierGroups[e.supplier].push(e);
  });

  Object.keys(supplierGroups).sort().forEach(function(sName) {
    wsData.push([]);
    wsData.push(['── SUPPLIER: ' + sName + ' ──']);

    var sEntries = supplierGroups[sName];

    // Group by product within supplier
    var productGroups = {};
    sEntries.forEach(function(e) {
      if (!productGroups[e.product]) { productGroups[e.product] = []; }
      productGroups[e.product].push(e);
    });

    Object.keys(productGroups).sort().forEach(function(pName) {
      var pEntries = productGroups[pName];
      pEntries.forEach(function(e) {
        wsData.push([
          e.product + (e.netWeight < 0 ? ' [RETURN]' : ''),
          e.containerType,
          e.quantity,
          e.grossWeight.toFixed(2),
          e.containerWeightTotal.toFixed(2),
          e.netWeight.toFixed(2)
        ]);
      });
      // Product subtotal
      var pNet = pEntries.reduce(function(s, e) { return s + e.netWeight; }, 0);
      var pGross = pEntries.reduce(function(s, e) { return s + e.grossWeight; }, 0);
      var pCtrWt = pEntries.reduce(function(s, e) { return s + e.containerWeightTotal; }, 0);
      var pQty = pEntries.reduce(function(s, e) { return s + (parseInt(e.quantity) || 0); }, 0);
      wsData.push(['  SUBTOTAL: ' + pName, '', pQty, pGross.toFixed(2), pCtrWt.toFixed(2), pNet.toFixed(2)]);
    });
  });

  // Grand total
  wsData.push([]);
  var totalGross = entries.reduce(function(s, e) { return s + e.grossWeight; }, 0);
  var totalCtrWt = entries.reduce(function(s, e) { return s + e.containerWeightTotal; }, 0);
  wsData.push(['GRAND TOTAL', '', '', totalGross.toFixed(2), totalCtrWt.toFixed(2), totalNet.toFixed(2)]);

  var ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [
    {wch:30},{wch:18},{wch:10},{wch:14},{wch:16},{wch:14}
  ];

  XLSX.utils.book_append_sheet(wb, ws, 'Summary');
  XLSX.writeFile(wb, 'delivery-summary-' + delivery + '.xlsx');
  showStatus('Export complete ✓', 'ok');
}

// ─────────────────────────────────────────────
// SUPPLIER MODAL
// ─────────────────────────────────────────────
function openSupplierModal() {
  selectedSupplierForProducts = null;
  document.getElementById('product-section').style.display = 'none';
  renderSupplierModalList();
  document.getElementById('supplier-modal').classList.add('open');
}

function renderSupplierModalList() {
  var html = '';
  if (suppliers.length === 0) {
    html = '<div style="color:var(--text-muted);font-size:0.8rem;padding:10px 0;">No suppliers yet.</div>';
  }
  suppliers.forEach(function(s, idx) {
    html += '<div class="modal-list-item">'
      + '<div><div class="item-name">' + esc(s.name) + '</div>'
      + '<div class="item-sub">' + (s.products ? s.products.length : 0) + ' products</div></div>'
      + '<div style="display:flex;gap:6px;">'
      + '<button class="btn btn-secondary" style="padding:5px 10px;font-size:0.7rem;" onclick="selectSupplierForProducts(' + idx + ')">Products</button>'
      + '<button class="btn btn-danger" style="padding:5px 10px;font-size:0.7rem;" onclick="deleteSupplier(' + idx + ')">✕</button>'
      + '</div></div>';
  });
  document.getElementById('supplier-list').innerHTML = html;
}

function addSupplier() {
  var name = document.getElementById('new-supplier-name').value.trim();
  if (!name) { return; }
  if (suppliers.find(function(s) { return s.name.toLowerCase() === name.toLowerCase(); })) {
    showStatus('Supplier already exists', 'err'); return;
  }
  var s = { name: name, products: [] };
  suppliers.push(s);
  document.getElementById('new-supplier-name').value = '';
  renderSupplierModalList();
  renderSupplierDropdown();
  postToSheets({ action: 'saveSuppliers', suppliers: suppliers });
  showStatus('Supplier added ✓', 'ok');
}

function deleteSupplier(idx) {
  if (!confirm('Delete supplier "' + suppliers[idx].name + '"?')) { return; }
  suppliers.splice(idx, 1);
  if (selectedSupplierForProducts !== null) {
    selectedSupplierForProducts = null;
    document.getElementById('product-section').style.display = 'none';
  }
  renderSupplierModalList();
  renderSupplierDropdown();
  postToSheets({ action: 'saveSuppliers', suppliers: suppliers });
  showStatus('Supplier deleted', 'ok');
}

function selectSupplierForProducts(idx) {
  selectedSupplierForProducts = idx;
  document.getElementById('product-section-label').textContent = suppliers[idx].name;
  document.getElementById('product-section').style.display = 'block';
  renderProductTags();
}

function renderProductTags() {
  if (selectedSupplierForProducts === null) { return; }
  var supp = suppliers[selectedSupplierForProducts];
  var html = '';
  if (supp.products && supp.products.length > 0) {
    supp.products.forEach(function(p, i) {
      html += '<span class="product-tag">' + esc(p)
        + '<button onclick="deleteProduct(' + i + ')">✕</button></span>';
    });
  } else {
    html = '<span style="color:var(--text-muted);font-size:0.75rem;">No products yet.</span>';
  }
  document.getElementById('product-tags').innerHTML = html;
}

function addProduct() {
  if (selectedSupplierForProducts === null) { return; }
  var name = document.getElementById('new-product-name').value.trim();
  if (!name) { return; }
  var supp = suppliers[selectedSupplierForProducts];
  if (!supp.products) { supp.products = []; }
  if (supp.products.includes(name)) { showStatus('Product already exists', 'err'); return; }
  supp.products.push(name);
  document.getElementById('new-product-name').value = '';
  renderProductTags();
  renderSupplierModalList();
  renderSupplierDropdown();
  postToSheets({ action: 'saveSuppliers', suppliers: suppliers });
  showStatus('Product added ✓', 'ok');
}

function deleteProduct(pIdx) {
  if (selectedSupplierForProducts === null) { return; }
  var supp = suppliers[selectedSupplierForProducts];
  supp.products.splice(pIdx, 1);
  renderProductTags();
  renderSupplierModalList();
  renderSupplierDropdown();
  postToSheets({ action: 'saveSuppliers', suppliers: suppliers });
  showStatus('Product deleted', 'ok');
}

// ─────────────────────────────────────────────
// CONTAINER MODAL
// ─────────────────────────────────────────────
function openContainerModal() {
  renderContainerModalList();
  document.getElementById('container-modal').classList.add('open');
}

function renderContainerModalList() {
  var html = '';
  containers.forEach(function(c, idx) {
    html += '<div class="modal-list-item">'
      + '<div><div class="item-name">' + esc(c.name) + '</div>'
      + '<div class="item-sub">' + c.weight + ' kg</div></div>'
      + '<button class="btn btn-danger" style="padding:5px 10px;font-size:0.7rem;" onclick="deleteContainer(' + idx + ')">✕</button>'
      + '</div>';
  });
  document.getElementById('container-list').innerHTML = html;
}

function addContainer() {
  var name = document.getElementById('new-container-name').value.trim();
  var weight = parseFloat(document.getElementById('new-container-weight').value);
  if (!name) { showStatus('Enter container name', 'err'); return; }
  if (isNaN(weight) || weight < 0) { showStatus('Enter valid weight', 'err'); return; }
  containers.push({ name: name, weight: weight });
  document.getElementById('new-container-name').value = '';
  document.getElementById('new-container-weight').value = '';
  renderContainerModalList();
  renderContainerDropdown();
  postToSheets({ action: 'saveContainers', containers: containers });
  showStatus('Container added ✓', 'ok');
}

function deleteContainer(idx) {
  if (!confirm('Delete container "' + containers[idx].name + '"?')) { return; }
  containers.splice(idx, 1);
  renderContainerModalList();
  renderContainerDropdown();
  postToSheets({ action: 'saveContainers', containers: containers });
  showStatus('Container deleted', 'ok');
}

// ─────────────────────────────────────────────
// MODAL HELPERS
// ─────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      overlay.classList.remove('open');
    }
  });
});

// ─────────────────────────────────────────────
// STATUS
// ─────────────────────────────────────────────
var statusTimer = null;

function showStatus(msg, type) {
  var bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'status-bar show' + (type ? ' ' + type : '');
  if (statusTimer) { clearTimeout(statusTimer); }
  statusTimer = setTimeout(function() {
    bar.className = 'status-bar';
  }, 2800);
}

// ─────────────────────────────────────────────
// ESCAPE HTML
// ─────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
